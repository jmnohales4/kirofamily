<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La familia Kiro crece</title>
<meta name="description" content="Animación corta: de CodeWhisperer a Amazon Q Developer, Kiro IDE, Kiro CLI y toda la familia Kiro.">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main>
  <h1>La familia Kiro crece</h1>

  <section id="stage" aria-live="polite">
    <div id="year"></div>
    <div id="cast"></div>
    <div id="caption"></div>
  </section>

  <nav id="timeline" aria-label="Línea de tiempo"></nav>

  <div id="controls">
    <button id="prev" aria-label="Anterior">⏮</button>
    <button id="play" aria-label="Pausa">⏸ Pausa</button>
    <button id="next" aria-label="Siguiente">⏭</button>
  </div>
</main>
<script src="./app.js"></script>
</body>
</html>
