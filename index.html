<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La evolución de Kiro</title>
<meta name="description" content="Animación con música: un pequeño héroe, CW, come una baya mágica y evoluciona a Amazon Q Developer y luego a Kiro, hasta formar toda la familia Kiro.">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main>
  <div id="wrap">
    <canvas id="c" width="960" height="540" role="img"
      aria-label="Animación: el héroe CW camina, come una baya mágica y se transforma en Amazon Q Developer, después en Kiro, y al final llega toda la familia Kiro."></canvas>

    <div id="start" class="overlay">
      <h1>La evolución de Kiro</h1>
      <p>De CodeWhisperer a toda la familia, como un héroe de anime.</p>
      <button id="go">▶ Empezar (con música)</button>
      <small>Sube el volumen. La música se genera en tu navegador.</small>
    </div>

    <div id="end" class="overlay" hidden>
      <button id="replay">↻ Ver otra vez</button>
    </div>
  </div>

  <p id="caption" aria-live="polite">&nbsp;</p>

  <div id="controls">
    <button id="pause">⏸ Pausa</button>
    <button id="mute">🔊 Música</button>
  </div>
</main>
<script src="./app.js"></script>
</body>
</html>
